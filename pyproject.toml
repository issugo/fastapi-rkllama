[project]
name = "fastapi-rkllama"
version = "0.1.0"
description = "LLM Server and Client for Rockchip 3588/3576"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "huggingface-hub>=0.34.4",
    "psutil>=7.1.3",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "torch>=2.8.0",
    "transformers>=4.55.4",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-bdd>=7.3.0",
    "deepeval>=1.2.0",
    "black>=24.10.0",
    "yamllint>=1.35.1",
    "interrogate>=1.7.0",
    "pydocstyle>=6.3.0",
    "toml>=0.10.2",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E501",  # Line too long (black handles lines)
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
fail-under = 0
exclude = ["setup.py", "docs", "tests", ".venv", "venv"]
color = true
verbose = 1

[tool.pydocstyle]
convention = "google"
add-ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D200", "D202", "D205", "D212", "D415", "D301", "D403", "D411",
    "D412", "D417"
]


